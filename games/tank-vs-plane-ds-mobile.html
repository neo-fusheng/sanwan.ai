<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>3D Tank vs Plane</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
html,body { width:100%; height:100%; overflow:hidden; background:#000; touch-action:none; -webkit-touch-callout:none; -webkit-user-select:none; user-select:none; }
#game-container { position:fixed; inset:0; }

/* Portrait Warning */
#portrait-warning {
  display:none; position:fixed; inset:0; z-index:1000;
  background:rgba(0,0,0,0.92); flex-direction:column; align-items:center; justify-content:center;
}
#portrait-warning .icon { font-size:80px; margin-bottom:20px; }
#portrait-warning .text { color:#fff; font-size:24px; font-weight:bold; text-align:center; padding:0 40px; }

/* Start Screen */
#start-screen {
  position:fixed; inset:0; z-index:900; display:flex; flex-direction:column; align-items:center; justify-content:center;
  background:linear-gradient(180deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
}
#start-screen .title { font-size:42px; color:#ffd700; font-weight:900; text-shadow:0 0 20px rgba(255,215,0,0.5); margin-bottom:8px; }
#start-screen .subtitle { font-size:18px; color:#aaa; margin-bottom:40px; }
#start-screen .instructions { color:#ccc; font-size:16px; text-align:center; line-height:1.8; margin-bottom:40px; padding:0 30px; }
#start-screen .instructions span { color:#ffd700; font-weight:bold; }
#start-btn {
  width:220px; height:70px; background:linear-gradient(180deg,#ff6b35,#e0451f); color:#fff;
  font-size:26px; font-weight:bold; border:none; border-radius:35px; cursor:pointer;
  box-shadow:0 4px 20px rgba(255,107,53,0.4); letter-spacing:2px;
  -webkit-tap-highlight-color:transparent;
}
#start-btn:active { transform:scale(0.95); }

/* Game UI */
#game-ui { display:none; position:fixed; top:0; left:0; right:0; z-index:100; pointer-events:none; padding:12px 16px; }
#score-panel { display:flex; justify-content:space-between; align-items:flex-start; }
#score-display { color:#fff; font-size:22px; font-weight:bold; text-shadow:0 0 10px rgba(255,255,255,0.5); }
#combo-display { color:#ffd700; font-size:28px; font-weight:900; text-shadow:0 0 15px rgba(255,215,0,0.6); opacity:0; transition:opacity 0.15s; }
#combo-display.active { opacity:1; }
#lives-display { color:#ff4444; font-size:18px; }
#game-over-screen {
  display:none; position:fixed; inset:0; z-index:800; background:rgba(0,0,0,0.85);
  flex-direction:column; align-items:center; justify-content:center;
}
#game-over-screen .go-title { font-size:38px; color:#ff4444; font-weight:900; margin-bottom:10px; }
#game-over-screen .go-score { font-size:48px; color:#ffd700; font-weight:900; margin-bottom:6px; }
#game-over-screen .go-label { font-size:18px; color:#aaa; margin-bottom:30px; }
#restart-btn {
  width:200px; height:65px; background:linear-gradient(180deg,#ff6b35,#e0451f); color:#fff;
  font-size:24px; font-weight:bold; border:none; border-radius:32px; cursor:pointer;
  box-shadow:0 4px 20px rgba(255,107,53,0.4);
  -webkit-tap-highlight-color:transparent;
}

/* Joysticks */
.joystick-base {
  position:fixed; z-index:200; pointer-events:none; border-radius:50%;
  background:radial-gradient(circle, rgba(255,255,255,0.18) 0%, rgba(255,255,255,0.06) 60%, rgba(255,255,255,0.02) 100%);
  border:2px solid rgba(255,255,255,0.2); display:none; transform:translate(-50%,-50%);
}
.joystick-thumb {
  position:absolute; border-radius:50%; top:50%; left:50%; transform:translate(-50%,-50%);
  background:radial-gradient(circle, rgba(255,255,255,0.6) 0%, rgba(255,255,255,0.2) 100%);
  box-shadow:0 0 12px rgba(255,255,255,0.4);
}

/* Heads-up text for joystick zone labels */
.joystick-label {
  position:fixed; z-index:195; pointer-events:none; color:rgba(255,255,255,0.35);
  font-size:13px; font-weight:bold; text-align:center; display:none;
}

</style>
</head>
<body>
<div id="game-container"></div>

<div id="portrait-warning">
  <div class="icon">📱</div>
  <div class="text">请横屏使用<br>Please rotate your device</div>
</div>

<div id="start-screen">
  <div class="title">🎯 坦克打飞机</div>
  <div class="subtitle">Tank vs Plane</div>
  <div class="instructions">
    <span>⬅️ 左下摇杆</span> — 移动坦克<br>
    <span>➡️ 右下摇杆</span> — 瞄准 + 松开发射<br>
    消灭敌机，保卫基地！
  </div>
  <button id="start-btn" ontouchstart="">开始游戏</button>
</div>

<div id="game-ui">
  <div id="score-panel">
    <div id="score-display">🏆 0</div>
    <div id="combo-display">COMBO x1</div>
    <div id="lives-display">❤️❤️❤️</div>
  </div>
</div>

<div id="game-over-screen">
  <div class="go-title">💥 游戏结束</div>
  <div class="go-score" id="go-score">0</div>
  <div class="go-label">最终得分 Final Score</div>
  <button id="restart-btn" ontouchstart="">再来一局</button>
</div>

<div class="joystick-base" id="move-joystick-base"><div class="joystick-thumb" id="move-joystick-thumb"></div></div>
<div class="joystick-base" id="aim-joystick-base"><div class="joystick-thumb" id="aim-joystick-thumb"></div></div>
<div class="joystick-label" id="move-label">移动</div>
<div class="joystick-label" id="aim-label">瞄准·发射</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.157.0/build/three.module.js"
  }
}
</script>

<script type="module">
import * as THREE from 'three';

// ─── DOM Elements ─────────────────────────────
const container = document.getElementById('game-container');
const portraitWarning = document.getElementById('portrait-warning');
const startScreen = document.getElementById('start-screen');
const startBtn = document.getElementById('start-btn');
const gameUI = document.getElementById('game-ui');
const scoreDisplay = document.getElementById('score-display');
const comboDisplay = document.getElementById('combo-display');
const livesDisplay = document.getElementById('lives-display');
const gameOverScreen = document.getElementById('game-over-screen');
const goScore = document.getElementById('go-score');
const restartBtn = document.getElementById('restart-btn');

const moveBase = document.getElementById('move-joystick-base');
const moveThumb = document.getElementById('move-joystick-thumb');
const aimBase = document.getElementById('aim-joystick-base');
const aimThumb = document.getElementById('aim-joystick-thumb');
const moveLabel = document.getElementById('move-label');
const aimLabel = document.getElementById('aim-label');

// ─── Three.js Setup ───────────────────────────
const renderer = new THREE.WebGLRenderer({ antialias: false, alpha: false });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = false;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.1;
container.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x5b8cbf);
scene.fog = new THREE.Fog(0x5b8cbf, 30, 90);

const camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.5, 200);
camera.position.set(0, 8, 14);
camera.lookAt(0, 2, 0);

// ─── Lighting ─────────────────────────────────
const ambientLight = new THREE.AmbientLight(0x8899bb, 1.4);
scene.add(ambientLight);
const sunLight = new THREE.DirectionalLight(0xffffff, 2.5);
sunLight.position.set(10, 20, 5);
scene.add(sunLight);
const fillLight = new THREE.DirectionalLight(0x8899cc, 0.7);
fillLight.position.set(-5, 3, -5);
scene.add(fillLight);

// ─── Ground ───────────────────────────────────
const groundGeo = new THREE.PlaneGeometry(80, 80);
const groundMat = new THREE.MeshLambertMaterial({ color: 0x3d5a2e });
const ground = new THREE.Mesh(groundGeo, groundMat);
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);

// Grid lines on ground for depth perception
const gridHelper = new THREE.PolarGridHelper(35, 40, 28, 128, 0x4a6d3a, 0x4a6d3a);
gridHelper.position.y = 0.02;
scene.add(gridHelper);

// Some decorative elements
for (let i = 0; i < 20; i++) {
  const treeGroup = new THREE.Group();
  const trunkGeo = new THREE.CylinderGeometry(0.15, 0.2, 1.2, 6);
  const trunkMat = new THREE.MeshLambertMaterial({ color: 0x6b4423 });
  const trunk = new THREE.Mesh(trunkGeo, trunkMat);
  trunk.position.y = 0.6;
  treeGroup.add(trunk);
  const topGeo = new THREE.ConeGeometry(0.6, 1.8, 8);
  const topMat = new THREE.MeshLambertMaterial({ color: 0x2d5a1e });
  const top = new THREE.Mesh(topGeo, topMat);
  top.position.y = 1.6;
  treeGroup.add(top);
  const angle = Math.random() * Math.PI * 2;
  const dist = 15 + Math.random() * 20;
  treeGroup.position.set(Math.cos(angle) * dist, 0, Math.sin(angle) * dist);
  treeGroup.scale.setScalar(0.7 + Math.random() * 0.6);
  scene.add(treeGroup);
}

// ─── Tank Construction ────────────────────────
const tankGroup = new THREE.Group();
const bodyGeo = new THREE.BoxGeometry(1.8, 0.6, 2.8);
const bodyMat = new THREE.MeshLambertMaterial({ color: 0x4a5d23 });
const body = new THREE.Mesh(bodyGeo, bodyMat);
body.position.y = 0.5;
body.castShadow = true;
tankGroup.add(body);

// Tracks
const trackGeo = new THREE.BoxGeometry(0.35, 0.25, 2.9);
const trackMat = new THREE.MeshLambertMaterial({ color: 0x2a2a2a });
const leftTrack = new THREE.Mesh(trackGeo, trackMat);
leftTrack.position.set(-0.95, 0.15, 0);
tankGroup.add(leftTrack);
const rightTrack = new THREE.Mesh(trackGeo, trackMat);
rightTrack.position.set(0.95, 0.15, 0);
tankGroup.add(rightTrack);

// Track details
for (let side = -1; side <= 1; side += 2) {
  for (let i = -1; i <= 1; i++) {
    const wheelGeo = new THREE.CylinderGeometry(0.18, 0.18, 0.15, 8);
    const wheelMat = new THREE.MeshLambertMaterial({ color: 0x444444 });
    const wheel = new THREE.Mesh(wheelGeo, wheelMat);
    wheel.rotation.z = Math.PI / 2;
    wheel.position.set(side * 0.95, 0.05, i * 1.0);
    tankGroup.add(wheel);
  }
}

// Turret pivot (independent rotation)
const turretPivot = new THREE.Group();
turretPivot.position.y = 0.85;
tankGroup.add(turretPivot);

// Turret base
const turretBaseGeo = new THREE.CylinderGeometry(0.55, 0.6, 0.4, 16);
const turretBaseMat = new THREE.MeshLambertMaterial({ color: 0x5a7a2e });
const turretBase = new THREE.Mesh(turretBaseGeo, turretBaseMat);
turretPivot.add(turretBase);

// Barrel pivot (elevation)
const barrelPivot = new THREE.Group();
barrelPivot.position.y = 0.15;
turretPivot.add(barrelPivot);

// Barrel
const barrelGeo = new THREE.CylinderGeometry(0.1, 0.14, 2.2, 8);
const barrelMat = new THREE.MeshLambertMaterial({ color: 0x3a4a1a });
const barrel = new THREE.Mesh(barrelGeo, barrelMat);
barrel.rotation.x = Math.PI / 2;
barrel.position.z = 1.1;
barrelPivot.add(barrel);

// Muzzle brake
const muzzleGeo = new THREE.BoxGeometry(0.18, 0.22, 0.3);
const muzzleMat = new THREE.MeshLambertMaterial({ color: 0x333333 });
const muzzle = new THREE.Mesh(muzzleGeo, muzzleMat);
muzzle.position.z = 2.25;
barrelPivot.add(muzzle);

tankGroup.position.set(0, 0, 0);
scene.add(tankGroup);

// ─── Game State ───────────────────────────────
const state = {
  score: 0,
  combo: 0,
  comboTimer: 0,
  hitFlashTimer: 0,
  lastHitPoints: 0,
  maxCombo: 0,
  lives: 5,
  gameStarted: false,
  gameOver: false,
  moveDir: new THREE.Vector2(),
  aimDir: new THREE.Vector2(),
  aimActive: false,
  turretTargetAngle: 0,
  barrelTargetElevation: 0.3,
  currentTurretAngle: 0,
  currentBarrelElevation: 0.3,
  tankSpeed: 6.5,
  enemies: [],
  bullets: [],
  explosions: [],
  spawnTimer: 0,
  spawnInterval: 2.5,
  bulletCooldown: 0,
  cameraSmoothPos: new THREE.Vector3(0, 8, 14),
  cameraSmoothLook: new THREE.Vector3(0, 3, 0),
};

// ─── Helper Functions ─────────────────────────
function getBarrelTip() {
  const tip = new THREE.Vector3(0, 0, 2.35);
  barrelPivot.localToWorld(tip);
  return tip;
}

function getBarrelDirection() {
  const dir = new THREE.Vector3(0, 0, 1);
  dir.applyQuaternion(barrelPivot.getWorldQuaternion(new THREE.Quaternion()));
  return dir.normalize();
}

// ─── Enemy Plane Creation ─────────────────────
const planeColors = [0xe74c3c, 0x3498db, 0xf39c12, 0x9b59b6, 0x1abc9c, 0xe67e22, 0x2ecc71, 0xe91e63];

function createEnemyPlane(position) {
  const group = new THREE.Group();

  // Fuselage
  const fuseGeo = new THREE.ConeGeometry(0.3, 1.8, 6, 8);
  const color = planeColors[Math.floor(Math.random() * planeColors.length)];
  const fuseMat = new THREE.MeshLambertMaterial({ color });
  const fuse = new THREE.Mesh(fuseGeo, fuseMat);
  fuse.rotation.x = Math.PI / 2;
  group.add(fuse);

  // Nose
  const noseGeo = new THREE.ConeGeometry(0.25, 0.5, 8);
  const nose = new THREE.Mesh(noseGeo, fuseMat);
  nose.position.z = 1.1;
  nose.rotation.x = Math.PI / 2;
  group.add(nose);

  // Wings
  const wingGeo = new THREE.BoxGeometry(2.0, 0.08, 0.6);
  const wingMat = new THREE.MeshLambertMaterial({ color: 0xcccccc });
  const wings = new THREE.Mesh(wingGeo, wingMat);
  wings.position.set(0, -0.15, -0.2);
  group.add(wings);

  // Tail
  const tailGeo = new THREE.BoxGeometry(1.0, 0.08, 0.3);
  const tail = new THREE.Mesh(tailGeo, wingMat);
  tail.position.set(0, 0.15, -0.7);
  group.add(tail);

  // Vertical fin
  const finGeo = new THREE.BoxGeometry(0.08, 0.5, 0.3);
  const fin = new THREE.Mesh(finGeo, wingMat);
  fin.position.set(0, 0.3, -0.75);
  group.add(fin);

  group.position.copy(position);

  // Slight random tilt
  group.rotation.z = (Math.random() - 0.5) * 0.3;
  group.rotation.x = (Math.random() - 0.5) * 0.15;

  scene.add(group);

  const speed = 3 + Math.random() * 3;
  const height = 3 + Math.random() * 8;
  const targetAngle = Math.atan2(-position.x, -position.z);

  return {
    mesh: group,
    speed,
    height,
    alive: true,
    size: 2.5, // collision radius — larger for easier mobile hitting
    targetAngle,
    wobble: Math.random() * Math.PI * 2,
    isDiving: false,
    diveTarget: null,
  };
}

// ─── Bullet Creation ──────────────────────────
function createBullet(origin, direction) {
  const bulletGeo = new THREE.SphereGeometry(0.12, 8, 8);
  const bulletMat = new THREE.MeshBasicMaterial({ color: 0xffdd44 });
  const bullet = new THREE.Mesh(bulletGeo, bulletMat);
  bullet.position.copy(origin);
  scene.add(bullet);

  // Trail
  const trailPositions = [];
  for (let i = 0; i < 15; i++) {
    trailPositions.push(origin.x, origin.y, origin.z);
  }
  const trailGeo = new THREE.BufferGeometry();
  trailGeo.setAttribute('position', new THREE.Float32BufferAttribute(trailPositions, 3));
  const trailMat = new THREE.LineBasicMaterial({ color: 0xffaa00, transparent: true, opacity: 0.6, linewidth: 1 });
  const trailLine = new THREE.Line(trailGeo, trailMat);
  scene.add(trailLine);

  return {
    mesh: bullet,
    direction: direction.clone(),
    speed: 25,
    alive: true,
    trail: trailPositions,
    trailLine,
    trailGeo,
  };
}

// ─── Explosion Creation ───────────────────────
function createExplosion(position, color = 0xff6600) {
  const particles = [];
  const count = 25;

  for (let i = 0; i < count; i++) {
    const geo = new THREE.SphereGeometry(0.06 + Math.random() * 0.12, 4, 4);
    const mat = new THREE.MeshBasicMaterial({
      color: new THREE.Color().setHSL(0.08 + Math.random() * 0.12, 1, 0.4 + Math.random() * 0.5),
    });
    const particle = new THREE.Mesh(geo, mat);
    particle.position.copy(position);
    const vel = new THREE.Vector3(
      (Math.random() - 0.5) * 8,
      Math.random() * 6 + 2,
      (Math.random() - 0.5) * 8
    );
    scene.add(particle);
    particles.push({ mesh: particle, velocity: vel, life: 0.6 + Math.random() * 0.6 });
  }

  // Flash
  const flashGeo = new THREE.SphereGeometry(0.5, 8, 8);
  const flashMat = new THREE.MeshBasicMaterial({ color, transparent: true, opacity: 0.9 });
  const flash = new THREE.Mesh(flashGeo, flashMat);
  flash.position.copy(position);
  scene.add(flash);
  particles.push({ mesh: flash, velocity: new THREE.Vector3(), life: 0.2, isFlash: true });

  state.explosions.push(...particles);
}

// ─── Joystick Setup ───────────────────────────
const JOYSTICK_RADIUS = 70; // radius in px
const JOYSTICK_MARGIN = 24;

let moveTouch = null;
let aimTouch = null;

function resizeJoysticks() {
  const w = window.innerWidth;
  const h = window.innerHeight;
  const size = JOYSTICK_RADIUS * 2;
  const thumbSize = JOYSTICK_RADIUS * 0.6;

  // Move joystick: bottom-left
  const moveX = JOYSTICK_RADIUS + JOYSTICK_MARGIN + 10;
  const moveY = h - JOYSTICK_RADIUS - JOYSTICK_MARGIN - 30;
  moveBase.style.width = size + 'px';
  moveBase.style.height = size + 'px';
  moveBase.style.left = moveX + 'px';
  moveBase.style.top = moveY + 'px';
  moveBase.dataset.cx = moveX;
  moveBase.dataset.cy = moveY;
  moveThumb.style.width = thumbSize + 'px';
  moveThumb.style.height = thumbSize + 'px';

  moveLabel.style.left = moveX + 'px';
  moveLabel.style.top = (moveY - JOYSTICK_RADIUS - 26) + 'px';
  moveLabel.style.transform = 'translate(-50%,0)';

  // Aim joystick: bottom-right
  const aimX = w - JOYSTICK_RADIUS - JOYSTICK_MARGIN - 10;
  const aimY = h - JOYSTICK_RADIUS - JOYSTICK_MARGIN - 30;
  aimBase.style.width = size + 'px';
  aimBase.style.height = size + 'px';
  aimBase.style.left = aimX + 'px';
  aimBase.style.top = aimY + 'px';
  aimBase.dataset.cx = aimX;
  aimBase.dataset.cy = aimY;
  aimThumb.style.width = thumbSize + 'px';
  aimThumb.style.height = thumbSize + 'px';

  aimLabel.style.left = aimX + 'px';
  aimLabel.style.top = (aimY - JOYSTICK_RADIUS - 26) + 'px';
  aimLabel.style.transform = 'translate(-50%,0)';
}

function showJoysticks() {
  moveBase.style.display = 'block';
  aimBase.style.display = 'block';
  moveLabel.style.display = 'block';
  aimLabel.style.display = 'block';
}

function hideJoysticks() {
  moveBase.style.display = 'none';
  aimBase.style.display = 'none';
  moveLabel.style.display = 'none';
  aimLabel.style.display = 'none';
}

function getJoystickOffset(touch, base) {
  const cx = parseFloat(base.dataset.cx);
  const cy = parseFloat(base.dataset.cy);
  let dx = touch.clientX - cx;
  let dy = touch.clientY - cy;
  const dist = Math.sqrt(dx * dx + dy * dy);
  const maxDist = JOYSTICK_RADIUS * 0.85;
  if (dist > maxDist) {
    dx = (dx / dist) * maxDist;
    dy = (dy / dist) * maxDist;
  }
  return { dx, dy, dist: Math.min(dist, maxDist), normalized: dist > 5 ? dist / maxDist : 0 };
}

function updateJoystickThumb(base, thumb, dx, dy) {
  thumb.style.transform = `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px))`;
}

function resetJoystickThumb(thumb) {
  thumb.style.transform = 'translate(-50%, -50%)';
}

function handleTouchStart(e) {
  if (state.gameOver) return;
  e.preventDefault();

  for (const touch of e.changedTouches) {
    const mx = touch.clientX;
    const my = touch.clientY;
    const w = window.innerWidth;

    // Determine which joystick zone
    const moveCX = parseFloat(moveBase.dataset.cx);
    const moveCY = parseFloat(moveBase.dataset.cy);
    const aimCX = parseFloat(aimBase.dataset.cx);
    const aimCY = parseFloat(aimBase.dataset.cy);

    const distMove = Math.hypot(mx - moveCX, my - moveCY);
    const distAim = Math.hypot(mx - aimCX, my - aimCY);

    // Left half of screen = move joystick priority
    // Right half = aim joystick priority
    if (mx < w / 2) {
      if (!moveTouch && distMove < JOYSTICK_RADIUS * 2) {
        moveTouch = touch.identifier;
      }
    }
    if (mx >= w / 2 || (mx < w / 2 && distAim < JOYSTICK_RADIUS)) {
      if (!aimTouch && distAim < JOYSTICK_RADIUS * 2) {
        aimTouch = touch.identifier;
        state.aimActive = true;
      }
    }
  }
  updateAllJoysticks(e.touches);
}

function handleTouchMove(e) {
  e.preventDefault();
  updateAllJoysticks(e.touches);
}

function handleTouchEnd(e) {
  e.preventDefault();

  for (const touch of e.changedTouches) {
    if (touch.identifier === moveTouch) {
      moveTouch = null;
      resetJoystickThumb(moveThumb);
      state.moveDir.set(0, 0);
    }
    if (touch.identifier === aimTouch) {
      // Fire on release if was actively aiming
      if (state.aimActive && state.gameStarted && !state.gameOver) {
        fireBullet();
      }
      aimTouch = null;
      state.aimActive = false;
      resetJoystickThumb(aimThumb);
      state.aimDir.set(0, 0);
    }
  }
  updateAllJoysticks(e.touches);
}

function updateAllJoysticks(touchList) {
  // Reset
  state.moveDir.set(0, 0);
  state.aimDir.set(0, 0);
  let moveFound = false;
  let aimFound = false;

  for (const touch of touchList) {
    if (touch.identifier === moveTouch) {
      const offset = getJoystickOffset(touch, moveBase);
      updateJoystickThumb(moveBase, moveThumb, offset.dx, offset.dy);
      if (offset.normalized > 0.1) {
        state.moveDir.set(offset.dx / JOYSTICK_RADIUS, -offset.dy / JOYSTICK_RADIUS);
        // Clamp magnitude to 1
        if (state.moveDir.length() > 1) state.moveDir.normalize();
      }
      moveFound = true;
    }
    if (touch.identifier === aimTouch) {
      const offset = getJoystickOffset(touch, aimBase);
      updateJoystickThumb(aimBase, aimThumb, offset.dx, offset.dy);
      if (offset.normalized > 0.08) {
        state.aimDir.set(offset.dx / JOYSTICK_RADIUS, -offset.dy / JOYSTICK_RADIUS);
        if (state.aimDir.length() > 1) state.aimDir.normalize();
      }
      state.aimActive = true;
      aimFound = true;
    }
  }

  if (!moveFound) {
    resetJoystickThumb(moveThumb);
    state.moveDir.set(0, 0);
  }
  if (!aimFound) {
    resetJoystickThumb(aimThumb);
    state.aimDir.set(0, 0);
  }
}

// ─── Fire Bullet ──────────────────────────────
function fireBullet() {
  if (state.bulletCooldown > 0) return;
  state.bulletCooldown = 0.25;

  const origin = getBarrelTip();
  const direction = getBarrelDirection();
  // Add slight spread
  direction.x += (Math.random() - 0.5) * 0.03;
  direction.y += (Math.random() - 0.5) * 0.03;
  direction.normalize();

  state.bullets.push(createBullet(origin, direction));

  // Muzzle flash effect
  createExplosion(origin, 0xffff88);
  // Limit muzzle flash particles
  const toRemove = [];
  state.explosions.forEach((p, i) => {
    if (p.life > 0.15) toRemove.push(i);
  });
  // Actually just let them die naturally
}

// ─── Spawn Enemy ──────────────────────────────
function spawnEnemy() {
  const tankPos = tankGroup.position;
  const angle = Math.random() * Math.PI * 2;
  const dist = 28 + Math.random() * 12;
  const x = tankPos.x + Math.cos(angle) * dist;
  const z = tankPos.z + Math.sin(angle) * dist;
  const y = 3 + Math.random() * 10;

  const enemy = createEnemyPlane(new THREE.Vector3(x, y, z));
  enemy.targetAngle = Math.atan2(tankPos.x - x, tankPos.z - z);
  state.enemies.push(enemy);
}

// ─── Update Functions ─────────────────────────
function updateTank(dt) {
  const dir = state.moveDir;
  if (dir.length() > 0.05) {
    const moveX = dir.x * state.tankSpeed * dt;
    const moveZ = dir.y * state.tankSpeed * dt;

    tankGroup.position.x += moveX;
    tankGroup.position.z += moveZ;

    // Rotate tank body toward movement direction
    const moveAngle = Math.atan2(dir.x, dir.y);
    const currentAngle = tankGroup.rotation.y;
    let diff = moveAngle - currentAngle;
    while (diff > Math.PI) diff -= Math.PI * 2;
    while (diff < -Math.PI) diff += Math.PI * 2;
    tankGroup.rotation.y += diff * Math.min(dt * 10, 1);

    // Clamp to ground area
    tankGroup.position.x = Math.max(-35, Math.min(35, tankGroup.position.x));
    tankGroup.position.z = Math.max(-35, Math.min(35, tankGroup.position.z));
  }

  // Update turret aim — right joystick directly controls turret angle (360°)
  const aimDir = state.aimDir;
  if (aimDir.length() > 0.08) {
    // Joystick polar angle maps directly to world-space turret heading
    const joystickAngle = Math.atan2(aimDir.x, aimDir.y);
    
    const camForward = new THREE.Vector3();
    camera.getWorldDirection(camForward);
    const camYaw = Math.atan2(camForward.x, camForward.z);
    
    state.turretTargetAngle = camYaw + joystickAngle;
  }

  // Snap turret rotation — no dead zones
  const worldTargetYaw = state.turretTargetAngle;
  const tankYaw = tankGroup.rotation.y;
  let relativeYaw = worldTargetYaw - tankYaw;
  while (relativeYaw > Math.PI) relativeYaw -= Math.PI * 2;
  while (relativeYaw < -Math.PI) relativeYaw += Math.PI * 2;
  turretPivot.rotation.y = relativeYaw;

  // Auto-elevation: find enemy closest to where turret is pointing
  if (state.aimActive && state.enemies.length > 0) {
    const barrelTip = getBarrelTip();
    const barrelDir = getBarrelDirection();
    
    let bestEnemy = null;
    let bestScore = Infinity;
    
    for (const enemy of state.enemies) {
      if (!enemy.alive) continue;
      
      // Vector from barrel tip to enemy
      const toEnemy = enemy.mesh.position.clone().sub(barrelTip);
      const dist = toEnemy.length();
      
      // Angle between barrel direction and direction to enemy
      toEnemy.normalize();
      const dot = barrelDir.dot(toEnemy);
      const angle = Math.acos(Math.max(-1, Math.min(1, dot)));
      
      // Prefer closer enemies that are near the aim line
      const score = angle * dist * 0.3 + dist * 0.7;
      if (score < bestScore) {
        bestScore = score;
        bestEnemy = enemy;
      }
    }
    
    if (bestEnemy) {
      // Calculate required elevation to hit this enemy
      const toEnemy = bestEnemy.mesh.position.clone().sub(barrelTip);
      const hDist = Math.sqrt(toEnemy.x * toEnemy.x + toEnemy.z * toEnemy.z);
      const vDist = toEnemy.y;
      
      // elevation = atan2(vertical, horizontal) - accounting for bullet drop would be nice but straight line is fine
      let targetElev = Math.atan2(vDist, Math.max(hDist, 0.5));
      targetElev = Math.max(0.15, Math.min(1.2, targetElev));
      state.barrelTargetElevation = targetElev;
    }
  } else {
    // Default elevation when not actively aiming
    state.barrelTargetElevation = 0.3;
  }

  // Smooth barrel elevation
  state.currentBarrelElevation += (state.barrelTargetElevation - state.currentBarrelElevation) * Math.min(dt * 15, 1);
  barrelPivot.rotation.x = -state.currentBarrelElevation;
}

function updateEnemies(dt) {
  const tankPos = tankGroup.position;

  for (let i = state.enemies.length - 1; i >= 0; i--) {
    const enemy = state.enemies[i];
    if (!enemy.alive) continue;

    const dx = tankPos.x - enemy.mesh.position.x;
    const dz = tankPos.z - enemy.mesh.position.z;
    const hDist = Math.sqrt(dx * dx + dz * dz);
    const ey = enemy.mesh.position.y;

    // Start diving when close enough horizontally
    if (!enemy.isDiving && hDist < 10) {
      enemy.isDiving = true;
      enemy.diveTarget = tankPos.clone();
      enemy.diveTarget.y = 0;
    }

    if (enemy.isDiving) {
      // Dive toward the tank — fast descent with forward movement
      const diveAngle = Math.atan2(dx, dz);
      const diveSpeed = enemy.speed * 2.5;
      enemy.mesh.position.x += Math.sin(diveAngle) * diveSpeed * dt;
      enemy.mesh.position.z += Math.cos(diveAngle) * diveSpeed * dt;
      
      // Descend rapidly
      enemy.mesh.position.y -= (enemy.speed * 2.5) * dt;

      // Pitch the plane nose-down during dive
      enemy.mesh.rotation.y = diveAngle + Math.PI;
      enemy.mesh.rotation.x = -0.8; // nose-down pitch

      // Check real collision — plane must be near ground level AND near tank
      if (ey < 1.2 && hDist < 2.5) {
        // Impact! Explosion at ground level
        const impactPos = enemy.mesh.position.clone();
        impactPos.y = 0.3;
        createExplosion(impactPos, 0xff4400);
        createExplosion(new THREE.Vector3(impactPos.x + 0.5, 0.6, impactPos.z + 0.5), 0xff8800);
        createExplosion(new THREE.Vector3(impactPos.x - 0.5, 0.4, impactPos.z - 0.3), 0xffaa00);

        enemy.alive = false;
        scene.remove(enemy.mesh);
        state.enemies.splice(i, 1);
        takeDamage();
        continue;
      }

      // If plane dove below ground without hitting, remove it
      if (ey < -3 || hDist > 30) {
        enemy.alive = false;
        scene.remove(enemy.mesh);
        state.enemies.splice(i, 1);
        continue;
      }
    } else {
      // Cruise mode — circle toward tank at altitude
      const angle = Math.atan2(dx, dz);
      enemy.mesh.position.x += Math.sin(angle) * enemy.speed * dt;
      enemy.mesh.position.z += Math.cos(angle) * enemy.speed * dt;

      // Maintain altitude with slight wobble
      enemy.mesh.position.y += Math.sin(enemy.wobble * 3) * dt * 0.5;

      // Orient plane toward movement
      enemy.mesh.rotation.y = angle + Math.PI;
      enemy.mesh.rotation.x = -0.1; // slight nose-down
    }

    // Remove if too far
    if (Math.abs(enemy.mesh.position.x - tankPos.x) > 55 || Math.abs(enemy.mesh.position.z - tankPos.z) > 55) {
      enemy.alive = false;
      scene.remove(enemy.mesh);
      state.enemies.splice(i, 1);
    }
  }
}

function updateBullets(dt) {
  for (let i = state.bullets.length - 1; i >= 0; i--) {
    const bullet = state.bullets[i];
    if (!bullet.alive) continue;

    bullet.mesh.position.add(bullet.direction.clone().multiplyScalar(bullet.speed * dt));

    // Update trail
    bullet.trail.push(bullet.mesh.position.x, bullet.mesh.position.y, bullet.mesh.position.z);
    if (bullet.trail.length > 45) bullet.trail.splice(0, 3);
    bullet.trailGeo.setAttribute('position', new THREE.Float32BufferAttribute(bullet.trail, 3));
    bullet.trailGeo.computeBoundingSphere();
    // Fade trail
    const alpha = Math.max(0, bullet.trailLine.material.opacity - dt * 0.8);
    bullet.trailLine.material.opacity = alpha;

    // Check if bullet went too far
    if (Math.abs(bullet.mesh.position.x - tankGroup.position.x) > 40 ||
        Math.abs(bullet.mesh.position.z - tankGroup.position.z) > 40 ||
        bullet.mesh.position.y > 25 || bullet.mesh.position.y < -2) {
      destroyBullet(i);
    }
  }
}

function updateExplosions(dt) {
  for (let i = state.explosions.length - 1; i >= 0; i--) {
    const p = state.explosions[i];
    p.life -= dt;
    if (p.life <= 0) {
      scene.remove(p.mesh);
      if (p.mesh.geometry) p.mesh.geometry.dispose();
      if (p.mesh.material) p.mesh.material.dispose();
      state.explosions.splice(i, 1);
      continue;
    }

    if (!p.isFlash) {
      p.mesh.position.add(p.velocity.clone().multiplyScalar(dt));
      p.velocity.y -= 9.8 * dt;
      const scale = p.life * 2;
      p.mesh.scale.setScalar(Math.max(0.01, scale));
      p.mesh.material.opacity = p.life;
      p.mesh.material.transparent = true;
    } else {
      p.mesh.scale.setScalar(p.mesh.scale.x + dt * 5);
      p.mesh.material.opacity = p.life / 0.2;
      p.mesh.material.transparent = true;
    }
  }
}

function destroyBullet(index) {
  const bullet = state.bullets[index];
  bullet.alive = false;
  scene.remove(bullet.mesh);
  scene.remove(bullet.trailLine);
  bullet.mesh.geometry.dispose();
  bullet.mesh.material.dispose();
  bullet.trailGeo.dispose();
  bullet.trailLine.material.dispose();
  state.bullets.splice(index, 1);
}

function checkCollisions() {
  for (let bi = state.bullets.length - 1; bi >= 0; bi--) {
    const bullet = state.bullets[bi];
    if (!bullet.alive) continue;

    for (let ei = state.enemies.length - 1; ei >= 0; ei--) {
      const enemy = state.enemies[ei];
      if (!enemy.alive) continue;

      const dist = bullet.mesh.position.distanceTo(enemy.mesh.position);
      if (dist < enemy.size) {
        // Hit!
        createExplosion(enemy.mesh.position.clone(), planeColors[Math.floor(Math.random() * planeColors.length)]);

        // Remove enemy
        enemy.alive = false;
        scene.remove(enemy.mesh);
        state.enemies.splice(ei, 1);

        // Remove bullet
        destroyBullet(bi);

        // Score
        state.combo++;
        state.comboTimer = 1.5;
        if (state.combo > state.maxCombo) state.maxCombo = state.combo;
        const points = 100 + state.combo * 25;
        state.score += points;

        // Hit feedback — flash the combo display
        state.hitFlashTimer = 0.6;
        state.lastHitPoints = points;
        comboDisplay.textContent = '💥 HIT! +' + points;
        comboDisplay.classList.add('active');

        // Bonus explosion for high combo
        if (state.combo >= 5) {
          createExplosion(enemy.mesh.position.clone().add(new THREE.Vector3(0, 2, 0)), 0xff4444);
        }

        break;
      }
    }
  }
}

function takeDamage() {
  state.lives--;
  updateLivesUI();
  // Screen shake effect
  camera.position.x += (Math.random() - 0.5) * 1;
  camera.position.y += (Math.random() - 0.5) * 0.5;
  if (state.lives <= 0) {
    gameOver();
  }
}

function gameOver() {
  state.gameOver = true;
  gameOverScreen.style.display = 'flex';
  goScore.textContent = state.score;
  hideJoysticks();
}

// ─── Spawn Timer ──────────────────────────────
function updateSpawning(dt) {
  state.spawnTimer += dt;
  // Spawn interval decreases over time
  const effectiveInterval = Math.max(0.6, state.spawnInterval - state.score / 1000);
  if (state.spawnTimer >= effectiveInterval) {
    state.spawnTimer = 0;
    spawnEnemy();
    // Sometimes spawn multiple
    if (state.score > 500 && Math.random() < 0.3) spawnEnemy();
    if (state.score > 1500 && Math.random() < 0.2) spawnEnemy();
  }
}

// ─── UI Updates ───────────────────────────────
function updateUI() {
  scoreDisplay.textContent = '🏆 ' + state.score;

  if (state.hitFlashTimer > 0) {
    state.hitFlashTimer -= 1 / 60;
    comboDisplay.textContent = '💥 HIT! +' + state.lastHitPoints;
    comboDisplay.classList.add('active');
    comboDisplay.style.transform = 'scale(1.2)';
  } else if (state.comboTimer > 0) {
    state.comboTimer -= 1 / 60;
    comboDisplay.textContent = '🔥 COMBO x' + state.combo;
    comboDisplay.classList.add('active');
    const scale = 1 + Math.min(state.combo * 0.08, 0.8);
    comboDisplay.style.transform = 'scale(' + scale + ')';
  } else {
    comboDisplay.classList.remove('active');
    state.combo = 0;
  }
}

function updateLivesUI() {
  livesDisplay.textContent = '❤️'.repeat(Math.max(0, state.lives));
}

// ─── Camera Update ────────────────────────────
function updateCamera(dt) {
  const tankPos = tankGroup.position;

  // Camera target position: behind and above the tank
  const backDir = new THREE.Vector3(0, 0, 1);
  backDir.applyQuaternion(tankGroup.quaternion);
  const targetPos = tankPos.clone()
    .add(backDir.clone().multiplyScalar(14))
    .add(new THREE.Vector3(0, 8, 0));

  const lookTarget = tankPos.clone().add(new THREE.Vector3(0, 3.5, 0));

  state.cameraSmoothPos.lerp(targetPos, dt * 4);
  state.cameraSmoothLook.lerp(lookTarget, dt * 5);

  camera.position.copy(state.cameraSmoothPos);
  camera.lookAt(state.cameraSmoothLook);
}

// ─── Orientation Check ────────────────────────
function checkOrientation() {
  const isPortrait = window.innerHeight > window.innerWidth;
  if (isPortrait && state.gameStarted && !state.gameOver) {
    portraitWarning.style.display = 'flex';
  } else {
    portraitWarning.style.display = 'none';
  }
}

// ─── Main Game Loop ───────────────────────────
const clock = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);

  const dt = Math.min(clock.getDelta(), 0.1);

  if (state.gameStarted && !state.gameOver) {
    updateTank(dt);
    updateEnemies(dt);
    updateBullets(dt);
    updateExplosions(dt);
    checkCollisions();
    updateSpawning(dt);
    updateCamera(dt);
    updateUI();
    state.bulletCooldown = Math.max(0, state.bulletCooldown - dt);
  }

  renderer.render(scene, camera);
}

// ─── Start / Restart ──────────────────────────
function startGame() {
  state.score = 0;
  state.combo = 0;
  state.comboTimer = 0;
  state.maxCombo = 0;
  state.lives = 3;
  state.gameStarted = true;
  state.gameOver = false;
  state.moveDir.set(0, 0);
  state.aimDir.set(0, 0);
  state.aimActive = false;
  state.turretTargetAngle = 0;
  state.barrelTargetElevation = 0.3;
  state.currentTurretAngle = 0;
  state.currentBarrelElevation = 0.3;
  state.spawnTimer = 0;
  state.spawnInterval = 2.5;
  state.bulletCooldown = 0;
  state.cameraSmoothPos.set(0, 8, 14);
  state.cameraSmoothLook.set(0, 3, 0);

  // Clear existing enemies/bullets/explosions
  for (const enemy of state.enemies) {
    scene.remove(enemy.mesh);
  }
  for (const bullet of state.bullets) {
    scene.remove(bullet.mesh);
    scene.remove(bullet.trailLine);
    bullet.mesh.geometry.dispose();
    bullet.mesh.material.dispose();
    bullet.trailGeo.dispose();
    bullet.trailLine.material.dispose();
  }
  for (const p of state.explosions) {
    scene.remove(p.mesh);
    if (p.mesh.geometry) p.mesh.geometry.dispose();
    if (p.mesh.material) p.mesh.material.dispose();
  }
  state.enemies = [];
  state.bullets = [];
  state.explosions = [];

  // Reset tank
  tankGroup.position.set(0, 0, 0);
  tankGroup.rotation.set(0, 0, 0);
  turretPivot.rotation.set(0, 0, 0);
  barrelPivot.rotation.set(0, 0, 0);

  // Reset camera
  camera.position.set(0, 8, 14);
  camera.lookAt(0, 3, 0);

  // Hide screens
  startScreen.style.display = 'none';
  gameOverScreen.style.display = 'none';
  gameUI.style.display = 'block';

  showJoysticks();
  resizeJoysticks();
  updateLivesUI();
  updateUI();
  checkOrientation();
}

function restartGame() {
  startGame();
}

// ─── Event Listeners ──────────────────────────
startBtn.addEventListener('click', startGame);
startBtn.addEventListener('touchend', (e) => {
  e.preventDefault();
  startGame();
});

restartBtn.addEventListener('click', restartGame);
restartBtn.addEventListener('touchend', (e) => {
  e.preventDefault();
  restartGame();
});

window.addEventListener('orientationchange', () => {
  setTimeout(() => {
    resizeJoysticks();
    renderer.setSize(window.innerWidth, window.innerHeight);
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    checkOrientation();
  }, 300);
});

window.addEventListener('resize', () => {
  resizeJoysticks();
  renderer.setSize(window.innerWidth, window.innerHeight);
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  checkOrientation();
});

// Touch events for joysticks
container.addEventListener('touchstart', handleTouchStart, { passive: false });
container.addEventListener('touchmove', handleTouchMove, { passive: false });
container.addEventListener('touchend', handleTouchEnd, { passive: false });
container.addEventListener('touchcancel', handleTouchEnd, { passive: false });

// Prevent default zoom/scroll
document.addEventListener('gesturestart', (e) => e.preventDefault());
document.addEventListener('gesturechange', (e) => e.preventDefault());
document.addEventListener('gestureend', (e) => e.preventDefault());

// ─── Initial Setup ────────────────────────────
resizeJoysticks();
checkOrientation();
updateLivesUI();

// Start render loop
animate();

console.log('🚀 3D Tank vs Plane - Mobile Ready');
console.log('Dual joystick controls: Left=Move, Right=Aim+Shoot');
</script>
